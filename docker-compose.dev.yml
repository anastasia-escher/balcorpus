services:
  ui:
    volumes:
      - ui_node_modules:/app/node_modules
    ports:
      # We should use the same port internally and externally, otherwise the dev tools support
      # of the browser is for almost nothing
      - "8130:8030"
    #command: yarn dev --host 0.0.0.0 --port 8099
    restart: unless-stopped
    depends_on:
      - api
    command:
      - /bin/sh
      - -c
      - |
        yarn install --frozen-lockfile &&
        yarn dev -- --host 0.0.0.0 --port 8030

  api:
    build:
      args:
        DCC_ENV: "dev"
    environment:
      - DJANGO_DEBUG=True
    ports:
      - "5130:5000"


  db:
    ports:
      - "54311:5432"

  mkdocs:
    build:
      context: docs
      dockerfile: Dockerfile
    ports:
      - "8112:8000"
    volumes:
      - ./docs/:/docs/:z

volumes:
  ui_node_modules:
